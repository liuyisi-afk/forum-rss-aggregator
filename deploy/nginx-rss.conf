# 示例配置：80 跳转 HTTPS，443 使用源站证书并反代本地应用；请替换 rss.example.com 为实际域名。
server {
    listen 80;
    listen [::]:80;
    server_name rss.example.com;  # 替换为你的实际域名

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rss.example.com;  # 替换为你的实际域名

    ssl_certificate /etc/nginx/certs/rss-origin.pem;
    ssl_certificate_key /etc/nginx/certs/rss-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:28888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
