name: Build feeds and deploy to Pages

on:
  schedule:
    # every 30 minutes: fetch + commit, no CF deploy
    - cron: "0,30 * * * *"
    # daily at 05:00 UTC: full digest archive for forum B
    - cron: "0 5 * * *"
    # every 12 hours: deploy to Cloudflare Pages
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_URL: ${{ secrets.SOURCE_URL }}
  FORUM_B_BASE_URL: ${{ secrets.FORUM_B_BASE_URL }}
  FORUM_B_INDEX_URL: ${{ secrets.FORUM_B_INDEX_URL }}
  SNAPSHOT_BASE_URL: ${{ secrets.SNAPSHOT_BASE_URL }}
  PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
  FEED_TITLE_A: ${{ secrets.FEED_TITLE_A }}
  FEED_TITLE_B: ${{ secrets.FEED_TITLE_B }}
  SECTIONS_B: ${{ secrets.SECTIONS_B }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CLOUDFLARE_API_KEY: ${{ secrets.CF_API_KEY }}
  CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL }}

jobs:
  build-forum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build forum feeds (91 + caoliu)
        env:
          BUILD_DIGEST_B: ${{ github.event.schedule == '0 5 * * *' && '1' || '0' }}
        run: python scripts/build_feeds.py public --only-forum

      - name: Upload forum artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forum-feeds
          path: public/

  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build gallery feeds (parallel)
        run: python scripts/build_feeds.py public --only-gallery

      - name: Upload gallery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gallery-feeds
          path: public/

  merge-deploy:
    needs: [build-forum, build-gallery]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download forum feeds
        uses: actions/download-artifact@v4
        with:
          name: forum-feeds
          path: public/

      - name: Download gallery feeds
        uses: actions/download-artifact@v4
        with:
          name: gallery-feeds
          path: public/

      - name: Commit feeds back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "no feed changes"
          else
            git commit -m "chore: refresh RSS feeds [skip ci]"
            git push
          fi

      - name: Deploy to Cloudflare Pages (every 12h only)
        if: github.event.schedule == '0 0,12 * * *' || github.event_name == 'workflow_dispatch'
        run: npx --yes wrangler@3 pages deploy public --project-name=rss-feed --branch=main
