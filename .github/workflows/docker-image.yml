name: Build feeds and deploy to Pages

on:
  schedule:
    # every 3 hours (UTC)
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  # real values are injected from repo secrets (not visible in public repo)
  SOURCE_URL: ${{ secrets.SOURCE_URL }}
  FORUM_B_BASE_URL: ${{ secrets.FORUM_B_BASE_URL }}
  FORUM_B_INDEX_URL: ${{ secrets.FORUM_B_INDEX_URL }}
  SNAPSHOT_BASE_URL: ${{ secrets.SNAPSHOT_BASE_URL }}
  PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
  FEED_TITLE_A: ${{ secrets.FEED_TITLE_A }}
  FEED_TITLE_B: ${{ secrets.FEED_TITLE_B }}
  SECTIONS_B: ${{ secrets.SECTIONS_B }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CLOUDFLARE_API_KEY: ${{ secrets.CF_API_KEY }}
  CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate RSS feeds
        run: python scripts/build_feeds.py public

      - name: Commit feeds back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "no feed changes"
          else
            git commit -m "chore: refresh RSS feeds [skip ci]"
            git push
          fi

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy public --project-name=rss-feed --branch=main
