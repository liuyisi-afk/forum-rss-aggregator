name: Build feeds and deploy to Pages

on:
  schedule:
    # Half past every hour.
    - cron: "30 * * * *"
    # Top of each ordinary hour, excluding the digest and deploy runs below.
    - cron: "0 1-4,6-11,13-23 * * *"
    # Daily at 05:00 UTC: build the full forum B digest.
    - cron: "0 5 * * *"
    # At 00:00 and 12:00 UTC: refresh feeds and deploy to Cloudflare Pages.
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    inputs:
      build_digest:
        description: "Force BUILD_DIGEST_B (1=full archive, 0=skip)"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

permissions:
  contents: read

concurrency:
  group: rss-feeds-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_URL: ${{ secrets.SOURCE_URL }}
  FORUM_B_BASE_URL: ${{ secrets.FORUM_B_BASE_URL }}
  FORUM_B_INDEX_URL: ${{ secrets.FORUM_B_INDEX_URL }}
  SNAPSHOT_BASE_URL: ${{ secrets.SNAPSHOT_BASE_URL }}
  PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
  FEED_TITLE_A: ${{ secrets.FEED_TITLE_A }}
  FEED_TITLE_B: ${{ secrets.FEED_TITLE_B }}
  SECTIONS_B: ${{ secrets.SECTIONS_B }}

jobs:
  build-forum:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build forum feeds
        env:
          BUILD_DIGEST_B: ${{ github.event_name == 'workflow_dispatch' && inputs.build_digest || (github.event.schedule == '0 5 * * *' && '1' || '0') }}
        run: python scripts/build_feeds.py public --only-forum

      - name: Upload forum artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forum-feeds
          path: |
            public/rss.xml
            public/caoliu-digest.xml
            public/forum-b*.xml
          if-no-files-found: error

  build-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build gallery feeds
        run: python scripts/build_feeds.py public --only-gallery

      - name: Upload gallery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gallery-feeds
          path: |
            public/gallery.xml
            public/gallery/
            public/feeds.opml
          if-no-files-found: error

  merge-deploy:
    needs: [build-forum, build-gallery]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download forum feeds
        uses: actions/download-artifact@v4
        with:
          name: forum-feeds
          path: ${{ runner.temp }}/forum-feeds

      - name: Download gallery feeds
        uses: actions/download-artifact@v4
        with:
          name: gallery-feeds
          path: ${{ runner.temp }}/gallery-feeds

      - name: Commit feeds back to repo
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$TARGET_BRANCH" ]; then
            echo "repository default branch is unavailable"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "push attempt $attempt"
            if ! git fetch --no-tags origin "refs/heads/$TARGET_BRANCH"; then
              echo "fetch failed on attempt $attempt"
              if [ "$attempt" -lt 3 ]; then
                sleep "$((attempt * 5))"
              fi
              continue
            fi
            git checkout -B "$TARGET_BRANCH" FETCH_HEAD

            mkdir -p public
            cp -a "$RUNNER_TEMP/forum-feeds/." public/
            cp -a "$RUNNER_TEMP/gallery-feeds/." public/
            git add public

            if git diff --cached --quiet; then
              echo "no feed changes"
              exit 0
            fi

            git commit -m "chore: refresh RSS feeds [skip ci]"
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 5))"
            fi
          done

          echo "push failed after 3 attempts"
          exit 1

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0,12 * * *'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CF_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL }}
        run: npx --yes wrangler@3 pages deploy public --project-name=rss-feed --branch=main
